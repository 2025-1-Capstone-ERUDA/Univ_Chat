# 사용자 질문을 임베딩 모델에 최적화된 문장으로 변환하는 프롬프트입니다.
embedding_prompt: |
  당신은 정보 검색 시스템을 위한 임베딩 생성 전문가입니다.
  아래의 사용자 질문을 의미적으로 가장 잘 요약하고, 핵심 키워드를 포함하며 명사형으로 재구성하세요.
  불필요한 수식어나 맥락은 제거하고, 질문의 의도와 주제를 분명하게 드러내세요.
  최종 결과는 임베딩 모델에 입력하기에 적합한 한 문장 또는 짧은 문단이어야 합니다.
  DB에 저장된 문서와 코사인 유사도로 검색할 때, 최적화된 문장이 가장 효과적으로 작동해야 합니다.

  사용자 질문: "{user_query}"

  임베딩 생성용 최적화 문장:
llm_prompt: |
  당신은 주어진 문서 내용을 읽고, 사용자의 질문에 대한 답변을 생성하는 AI입니다.
  아래의 문서 내용을 바탕으로, 사용자의 질문에 대한 답변을 작성하세요.

  문서 내용: "{document_content}"

  사용자 질문: "{user_query}"

  답변: